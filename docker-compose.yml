services:
  api:
    build:
      context: .
      target: api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-change-me-before-public-launch}
      APP_URL: ${APP_URL:-http://localhost:3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DB_PATH: /data/contract-spirit.db
      EXPOSE_RESET_URL: ${EXPOSE_RESET_URL:-false}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      FEEDBACK_ADMIN_KEY: ${FEEDBACK_ADMIN_KEY:-}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
    volumes:
      - cs_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  cs_data:
